<!DOCTYPE html>
<html>
<head><title>Netlify Forms</title></head>
<body>
  <!-- Quote form -->
  <form name="quote" data-netlify="true" netlify-honeypot="bot-field">
    <input type="hidden" name="form-name" value="quote" />
    <input name="bot-field" type="hidden" />
    <input name="firstName" type="text" />
    <input name="lastName" type="text" />
    <input name="email" type="email" />
    <input name="phone" type="tel" />
    <input name="businessName" type="text" />
    <input name="coatingType" type="text" />
    <input name="annualRevenue" type="text" />
    <input name="employees" type="number" />
    <input name="needsCPL" type="text" />
    <input name="state" type="text" />
    <textarea name="message"></textarea>
    <!-- added by josh-desk-2 2026-09-19: these are rendered on the live page but were not declared, so Netlify silently dropped them -->
    <input name="name"><input name="company"><input name="operationType"><input name="crewSize"><input name="coverageNeeded">
  </form>
  <!-- Contact form -->
  <form name="contact" data-netlify="true" netlify-honeypot="bot-field">
    <input type="hidden" name="form-name" value="contact" />
    <input name="bot-field" type="hidden" />
    <input name="name" type="text" />
    <input name="email" type="email" />
    <input name="phone" type="tel" />
    <input name="businessType" type="text" />
    <textarea name="message"></textarea>
  </form>
</body>
</html>
